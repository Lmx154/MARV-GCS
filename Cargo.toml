[workspace]
resolver = "3"
members = [
    "crates/gcs-transport",
    "crates/gcs-mavlink",
    "crates/gcs-link",
    "crates/gcs-sim",
    "crates/gcs-dflog",
    "crates/marv-gcs",
    "crates/marv-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# One place for every version. A crate takes a dependency with `name.workspace = true`.
# The layer rules in docs/architecture.md say which crate may use which of these.
[workspace.dependencies]
gcs-transport = { path = "crates/gcs-transport" }
gcs-mavlink = { path = "crates/gcs-mavlink" }
gcs-link = { path = "crates/gcs-link" }
gcs-sim = { path = "crates/gcs-sim" }
gcs-dflog = { path = "crates/gcs-dflog" }

mavlink = { version = "=0.21.0", default-features = false, features = ["std", "serde", "dialect-common", "mav2-message-extensions"] }
marv-dialect = { git = "https://github.com/Lmx154/marv-dialect.git", rev = "af6baa107046219dee49cd88c81f9809c134e761", features = ["std", "serde"] }
serialport = "4.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_plot = "0.38.0"
egui_extras = "0.37.0"
egui_kittest = "0.37.0"
png = "0.18"
walkers = "0.65.0"

[profile.dev]
# Line tables only: backtraces keep file and line, and linking the many test binaries (each with the Map tab's
# HTTP stack) stays under this machine's 4 GB build limit (see the workspace README, "Building").
debug = "line-tables-only"
